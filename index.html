<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anvi Anand</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fafafa;
      color: #111;
      text-align: center;
      padding: 1rem;
    }
    h1 { font-size: clamp(2.5rem, 8vw, 5rem); font-weight: 700; letter-spacing: -0.02em; }
    p { font-size: clamp(1.25rem, 3vw, 1.75rem); color: #666; }
    @media (prefers-color-scheme: dark) {
      body { background: #111; color: #f5f5f5; }
      p { color: #999; }
    }
  </style>
</head>
<body>
  <h1>Anvi Anand</h1>
  <p>Hello World</p>
</body>
</html>
