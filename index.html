<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anvi Anand</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fafafa;
      color: #111;
    }
    nav {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 60px;
      border-bottom: 1px solid #e5e5e5;
      background: #fff;
      font-size: 1.1rem;
      font-weight: 600;
    }
    main {
      max-width: 800px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem;
      text-align: center;
    }
    main h1 { font-size: clamp(2.5rem, 8vw, 4rem); font-weight: 500; }
    main h2 { font-size: clamp(1.5rem, 5vw, 2rem); font-weight: 400; margin-top: 0.25rem; }
    main p { font-size: clamp(1.1rem, 3vw, 1.4rem); margin-top: 0.75rem; line-height: 1.4; }
    @media (prefers-color-scheme: dark) {
      body { background: #111; color: #f5f5f5; }
      nav { background: #1a1a1a; border-bottom-color: #333; }
    }
  </style>
</head>
<body>
  <nav>Anvi Anand</nav>
  <main>
    <h1>Welcome!</h1>
    <h2>I'm Anvi Anand!</h2>
    <p>I'm currently in 8th grade. I am aspiring to be a writer and actor.</p>
    <p>Check out the sneak peek of my book below!</p>
  </main>
</body>
</html>
